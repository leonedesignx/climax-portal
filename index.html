<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" id="themeColorMeta" content="#090a08" />
<script>
(()=>{try{document.documentElement.dataset.theme=localStorage.getItem('apice-theme')||'dark'}catch(e){document.documentElement.dataset.theme='dark'}})();
</script>
<title>Ápice Workspace — Protótipo com Editorial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --lime:#ADF403;
  --lime-soft:#c7ff3b;
  --bg:#090a08;
  --bg-2:#0d0f0b;
  --panel:#10120f;
  --panel-2:#151814;
  --panel-3:#1a1e18;
  --line:#272c24;
  --line-strong:#343b2f;
  --muted:#90988c;
  --muted-2:#6e766a;
  --text:#f5f7f1;
  --warn:#ffcb66;
  --info:#7ab8ff;
  --danger:#ff8b8b;
  --gray:#a2a89d;
  --shadow:0 22px 60px rgba(0,0,0,.34);
  --radius:18px;
  --radius-sm:12px;
  --sidebar:236px;
}
*{box-sizing:border-box}
html{background:var(--bg);color-scheme:dark}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100svh;overflow-x:hidden}
button,input,textarea,select{font:inherit}
button{border:0;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
h1,h2,h3,h4{font-family:Manrope,Inter,sans-serif;margin:0;letter-spacing:-.025em}
p{margin:0}
a{color:inherit}
svg{display:block}
.hidden{display:none!important}

/* ---------- shell ---------- */
.app-shell{display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr);min-height:100svh}
.sidebar{position:sticky;top:0;height:100svh;border-right:1px solid var(--line);background:linear-gradient(180deg,#0d0f0b 0%,#0a0b09 100%);padding:22px 14px 18px;display:flex;flex-direction:column;z-index:30}
.brand-wrap{display:flex;align-items:center;min-height:44px;padding:0 8px;margin-bottom:26px}
.brand-logo{width:148px;max-height:42px;object-fit:contain;object-position:left center}
.nav-section{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#596155;font-weight:800;padding:0 12px;margin:18px 0 7px}
.side-nav{display:grid;gap:4px}
.nav-btn{width:100%;display:flex;align-items:center;gap:11px;background:transparent;color:#aab1a4;padding:10px 11px;border-radius:11px;font-size:13px;font-weight:650;text-align:left;transition:.18s ease}
.nav-btn svg{width:17px;height:17px;stroke:currentColor;stroke-width:1.8;fill:none;flex:0 0 auto}
.nav-btn:hover{background:#151914;color:#f1f4ed}
.nav-btn.active{background:linear-gradient(90deg,rgba(173,244,3,.14),rgba(173,244,3,.05));color:var(--lime);box-shadow:inset 2px 0 0 var(--lime)}
.nav-badge{margin-left:auto;min-width:20px;height:20px;border-radius:999px;padding:0 6px;background:rgba(173,244,3,.12);color:var(--lime);font-size:10px;display:grid;place-items:center;font-weight:800}
.side-footer{margin-top:auto;border-top:1px solid var(--line);padding-top:14px}
.profile-mini{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;cursor:pointer;transition:.18s ease}
.profile-mini:hover{background:#141713}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--lime);color:#0a0b08;display:grid;place-items:center;font-size:11px;font-weight:900;flex:0 0 auto}
.profile-mini strong{display:block;font-size:11px}.profile-mini span{display:block;color:var(--muted);font-size:9.5px;margin-top:2px}

.main{min-width:0;min-height:100svh}
.topbar{height:68px;position:sticky;top:0;z-index:25;display:flex;align-items:center;gap:12px;padding:0 clamp(20px,3vw,36px);border-bottom:1px solid rgba(39,44,36,.9);background:rgba(9,10,8,.88);backdrop-filter:blur(18px)}
.mobile-logo{display:none}
.search{width:min(360px,36vw);position:relative}
.search svg{position:absolute;width:16px;height:16px;left:12px;top:50%;transform:translateY(-50%);stroke:#747c70;fill:none;stroke-width:1.8}
.search input{width:100%;height:38px;border:1px solid var(--line);background:#10120f;color:var(--text);border-radius:11px;padding:0 12px 0 37px;font-size:12px}
.search input::placeholder{color:#697165}
.top-spacer{flex:1}
.top-icon{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:#10120f;display:grid;place-items:center;color:#aeb5a8;position:relative}
.top-icon svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8}
.notification-dot{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--lime);right:7px;top:6px;box-shadow:0 0 0 3px #10120f}
.role-pill{height:36px;border:1px solid var(--line);background:#11130f;border-radius:999px;padding:0 12px;display:flex;align-items:center;gap:8px;font-size:11px;color:#c7ccc1;font-weight:750}
.role-pill .role-dot{width:7px;height:7px;border-radius:50%;background:var(--lime)}
.mobile-profile{display:none}

.page{max-width:1440px;margin:0 auto;padding:28px clamp(20px,3vw,38px) 56px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:24px}
.page-head h1{font-size:clamp(24px,2vw,31px);line-height:1.05}
.page-head p{margin-top:7px;color:var(--muted);font-size:12.5px;line-height:1.5}
.page-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{min-height:40px;border-radius:11px;padding:0 15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--lime);color:#0d1009;font-weight:850;font-size:12px;box-shadow:0 8px 24px rgba(173,244,3,.08);transition:.18s ease}
.btn:hover{background:#bdff13;transform:translateY(-1px)}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
.btn-secondary{background:#151814;color:#e9ece6;border:1px solid var(--line);box-shadow:none}
.btn-secondary:hover{background:#1a1e18}
.btn-danger{background:rgba(255,139,139,.1);color:#ff9b9b;border:1px solid rgba(255,139,139,.2);box-shadow:none}

/* ---------- common ---------- */
.surface{background:linear-gradient(180deg,#11140f,#0f110e);border:1px solid var(--line);border-radius:var(--radius)}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:28px 0 12px}
.section-head h3{font-size:14px;color:#dfe4dc}
.link-btn{background:transparent;color:var(--lime);font-size:11px;font-weight:800;padding:5px}
.filters{display:flex;gap:8px;align-items:center;margin-bottom:18px;overflow:auto;padding-bottom:2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{height:34px;white-space:nowrap;border:1px solid var(--line);background:#10120f;color:var(--muted);padding:0 12px;border-radius:999px;font-size:11px;font-weight:750}
.chip.active{border-color:rgba(173,244,3,.38);background:rgba(173,244,3,.09);color:var(--lime)}
.select-control{height:38px;background:#10120f;border:1px solid var(--line);color:#d9ddd5;border-radius:11px;padding:0 34px 0 12px;font-size:11px}
.divider{height:1px;background:var(--line)}

/* ---------- home ---------- */
.hero-row{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(270px,.75fr);gap:16px;align-items:start}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{min-height:116px;background:linear-gradient(180deg,#121510,#0f110e);border:1px solid var(--line);border-radius:16px;padding:15px;position:relative;overflow:hidden}
.stat:after{content:"";position:absolute;width:80px;height:80px;border-radius:50%;background:rgba(173,244,3,.035);right:-24px;bottom:-30px}
.stat-icon{width:30px;height:30px;border-radius:10px;background:rgba(173,244,3,.09);color:var(--lime);display:grid;place-items:center;margin-bottom:15px}
.stat-icon svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}
.stat .k{color:#7f8779;font-size:10.5px;font-weight:700;line-height:1.35}
.stat .v{font:800 25px Manrope;margin-top:4px}
.stat .trend{font-size:9px;color:#697165;margin-top:5px}
.stat .trend.good{color:#9ddf12}.stat .trend.bad{color:#ec8d8d}
.home-main{margin-top:16px;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,.8fr);gap:16px}
.list-card{padding:4px 14px 10px}
.content-row{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:11px;align-items:center;padding:10px 0;border-bottom:1px solid #20241d;cursor:pointer}
.content-row:last-child{border-bottom:0}
.row-thumb{width:46px;height:54px;border-radius:9px;background:linear-gradient(145deg,#27331b,#0e100d);display:grid;place-items:center;color:var(--lime);font-weight:900;font-size:13px;overflow:hidden}
.row-copy{min-width:0}.row-copy strong{font-size:11.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row-copy span{font-size:9.5px;color:var(--muted);display:block;margin-top:4px}
.home-side{display:grid;gap:16px}
.storage-mini{padding:17px}.storage-mini .value{font:800 26px Manrope;margin-top:8px}.storage-mini .value span{font:600 11px Inter;color:var(--muted)}
.meter{height:9px;border-radius:999px;background:#22261e;overflow:hidden;margin:12px 0 8px}.meter>span{display:block;height:100%;background:linear-gradient(90deg,var(--lime),#d3ff50);border-radius:inherit}
.storage-label{display:flex;justify-content:space-between;color:#7b8375;font-size:9.5px}
.approval-list{padding:15px}.approval-item{display:grid;grid-template-columns:34px 1fr auto;gap:9px;align-items:center;padding:9px 0;border-bottom:1px solid #20241d}.approval-item:last-child{border-bottom:0}
.approval-avatar{width:34px;height:34px;border-radius:9px;background:#21271b;display:grid;place-items:center;color:var(--lime);font-weight:850;font-size:9px}.approval-item strong{font-size:10.5px;display:block}.approval-item span{font-size:9px;color:var(--muted);margin-top:2px;display:block}.approval-time{font-size:9px;color:#8b9385;white-space:nowrap}

/* ---------- content cards ---------- */
.post-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:14px}
.post-card{background:linear-gradient(180deg,#121510,#0f110e);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;transition:.18s ease;min-width:0}
.post-card:hover{border-color:#374130;transform:translateY(-2px);box-shadow:0 14px 35px rgba(0,0,0,.18)}
.post-cover{aspect-ratio:4/3;position:relative;display:grid;place-items:center;overflow:hidden;background:#171a14;cursor:pointer}
.post-cover:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.36))}
.cv1{background:linear-gradient(145deg,#36451f,#11140e)}.cv2{background:linear-gradient(145deg,#203142,#0f1212)}.cv3{background:linear-gradient(145deg,#3a2424,#12100f)}.cv4{background:linear-gradient(145deg,#25301f,#10130d)}
.cover-icon{width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.15);background:rgba(8,10,7,.46);backdrop-filter:blur(6px);display:grid;place-items:center;z-index:1;color:var(--lime)}
.cover-icon svg{width:17px;height:17px;fill:currentColor}
.media-type{position:absolute;left:10px;bottom:9px;z-index:2;height:24px;padding:0 8px;border-radius:999px;background:rgba(8,10,7,.66);backdrop-filter:blur(7px);display:flex;align-items:center;gap:5px;color:#dce2d8;font-size:9px;font-weight:800}
.card-menu-btn{position:absolute;right:9px;top:9px;z-index:2;width:30px;height:30px;border-radius:9px;background:rgba(8,10,7,.62);backdrop-filter:blur(7px);display:grid;place-items:center;color:#d8ddd4;font-size:18px;line-height:1}
.post-body{padding:12px;display:grid;gap:10px}
.post-client{font-size:9.5px;color:#81897b;font-weight:700}
.post-title{font-size:12px;font-weight:800;line-height:1.35;margin-top:3px}
.post-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;color:#7f877a;font-size:9.5px}
.status-wrap{position:relative}
.status-pill{width:100%;height:31px;display:flex;align-items:center;gap:7px;padding:0 10px;border-radius:10px;font-size:10px;font-weight:800;background:transparent;text-align:left}
.status-pill:after{content:"⌄";margin-left:auto;opacity:.65;font-size:11px}
.dot{width:6px;height:6px;border-radius:50%;flex:0 0 auto;background:currentColor}
.st-waiting{background:rgba(255,203,102,.11)!important;color:var(--warn)!important}.st-approved{background:rgba(173,244,3,.11)!important;color:var(--lime)!important}.st-material{background:rgba(122,184,255,.11)!important;color:var(--info)!important}.st-changes{background:rgba(255,139,139,.11)!important;color:var(--danger)!important}.st-draft{background:rgba(154,160,148,.11)!important;color:var(--gray)!important}
.status-menu{position:absolute;top:calc(100% + 7px);left:0;right:0;background:#171a14;border:1px solid #31372d;border-radius:12px;padding:5px;display:none;flex-direction:column;gap:2px;z-index:10;box-shadow:var(--shadow)}
.status-menu.open{display:flex}.status-menu button{display:flex;align-items:center;gap:8px;min-height:34px;border-radius:8px;padding:0 9px;background:transparent;font-size:10px;text-align:left}.status-menu button:hover{background:#1f241c}
.card-actions{display:flex;gap:7px;align-items:center;padding-top:1px}
.card-action{height:31px;padding:0 10px;border-radius:9px;background:#171a14;border:1px solid var(--line);color:#a8afa2;font-size:9.5px;font-weight:750;display:inline-flex;align-items:center;gap:6px}
.card-action svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8}.card-action.primary{margin-left:auto;background:rgba(173,244,3,.1);color:var(--lime);border-color:rgba(173,244,3,.16)}

/* ---------- clients ---------- */
.client-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.client-card{padding:16px;position:relative;cursor:pointer;transition:.18s ease}.client-card:hover{border-color:#374130;transform:translateY(-2px)}
.client-top{display:flex;align-items:center;gap:11px}.client-logo{width:45px;height:45px;border-radius:13px;background:linear-gradient(145deg,#232a1d,#151813);display:grid;place-items:center;color:var(--lime);font-size:12px;font-weight:900;flex:0 0 auto}.client-card h3{font-size:13px}.client-card p{font-size:9.5px;color:var(--muted);margin-top:4px}.client-arrow{margin-left:auto;color:#697165}.client-arrow svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8}.client-status-row{display:flex;gap:6px;margin-top:15px;flex-wrap:wrap}.mini-badge{min-height:24px;padding:0 8px;border-radius:999px;display:inline-flex;align-items:center;gap:5px;font-size:9px;font-weight:800}.client-foot{display:flex;align-items:center;justify-content:space-between;margin-top:15px;padding-top:12px;border-top:1px solid #20241d;color:#7e8678;font-size:9.5px}

/* ---------- calendar ---------- */
.calendar-shell{overflow:hidden}.calendar-toolbar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}.calendar-toolbar strong{font-size:12px}.month-nav{display:flex;gap:6px}.month-btn{width:32px;height:32px;border-radius:9px;background:#171a14;border:1px solid var(--line);color:#9da598}.month-btn:hover{color:var(--text)}
.cal-head,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}.cal-head div{height:38px;display:grid;place-items:center;background:#141712;color:#747d70;font-size:9px;text-transform:uppercase;letter-spacing:.08em;font-weight:800}.cal-day{min-height:118px;border-top:1px solid var(--line);border-right:1px solid var(--line);padding:8px;overflow:hidden}.cal-day:nth-child(7n){border-right:0}.cal-day .n{color:#70786d;font-size:9px;margin-bottom:7px}.cal-day.today .n{width:22px;height:22px;border-radius:50%;background:var(--lime);color:#0c0e0a;display:grid;place-items:center;font-weight:900}.cal-ev{border-left:2px solid var(--lime);background:#1a2016;border-radius:6px;padding:5px 6px;margin-top:4px;font-size:8.5px;line-height:1.35;color:#cdd3c8;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cal-ev.changes{border-left-color:var(--danger);background:rgba(255,139,139,.07)}
.agenda-mobile{display:none}.agenda-date{font:800 12px Manrope;color:#dfe4da;margin:18px 0 8px}.agenda-item{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.agenda-time{font-size:10px;color:#7f877b}.agenda-item strong{display:block;font-size:11px}.agenda-item span{display:block;font-size:9px;color:var(--muted);margin-top:3px}

/* ---------- files / settings ---------- */
.archive-grid{display:grid;grid-template-columns:minmax(320px,.8fr) minmax(0,1.2fr);gap:16px}.storage-card{padding:19px}.storage-card .value{font:800 29px Manrope;margin:10px 0 3px}.storage-card .value span{font:600 11px Inter;color:var(--muted)}.storage-copy{font-size:10.5px;line-height:1.6;color:#899184}.archive-list{padding:6px 14px}.archive-month{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:13px 0;border-bottom:1px solid #20241d}.archive-month:last-child{border-bottom:0}.archive-month strong{font-size:11.5px}.archive-month p{font-size:9.5px;color:var(--muted);margin-top:4px}.archive-state{font-size:9px;color:var(--lime);font-weight:800}.settings-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}.settings-card{padding:18px}.settings-card h3{font-size:13px;margin-bottom:14px}.field{display:grid;gap:6px;margin-bottom:12px}.field label{font-size:10px;color:#aeb5aa;font-weight:750}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:#0d0f0b;color:var(--text);border-radius:10px;padding:10px 11px;font-size:11px}.field textarea{min-height:96px;resize:vertical}.hint{font-size:9px;color:#687064;line-height:1.45}

/* ---------- drawer / modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.56);backdrop-filter:blur(4px);z-index:80;opacity:0;pointer-events:none;transition:.2s ease}.overlay.open{opacity:1;pointer-events:auto}
.drawer{position:absolute;right:0;top:0;height:100%;width:min(510px,92vw);background:#0d0f0b;border-left:1px solid var(--line);box-shadow:-18px 0 55px rgba(0,0,0,.35);transform:translateX(100%);transition:.24s cubic-bezier(.2,.75,.25,1);display:flex;flex-direction:column}.overlay.open .drawer{transform:translateX(0)}
.drawer-head{height:62px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 16px;gap:10px;flex:0 0 auto}.drawer-head strong{font-size:12px}.close-btn{margin-left:auto;width:34px;height:34px;border-radius:10px;background:#171a14;border:1px solid var(--line);color:#a7afa1;font-size:18px}.drawer-scroll{overflow:auto;padding:16px 16px 120px}.detail-preview{aspect-ratio:16/10;border-radius:16px;background:linear-gradient(145deg,#27351b,#10130d);display:grid;place-items:center;position:relative;overflow:hidden;margin-bottom:16px}.detail-preview.story{aspect-ratio:9/14;max-height:440px;margin-inline:auto}.detail-preview .cover-icon{width:54px;height:54px}.detail-title{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.detail-title h2{font-size:19px;line-height:1.25}.detail-kicker{font-size:9px;color:var(--muted);font-weight:750;margin-bottom:6px}.detail-copy{font-size:11px;color:#b7bdb2;line-height:1.65;margin-top:13px}.detail-block{margin-top:20px}.detail-block h4{font-size:11px;color:#dce1d8;margin-bottom:9px}.timeline{display:grid;gap:10px}.timeline-item{display:grid;grid-template-columns:12px 1fr;gap:9px}.timeline-mark{width:8px;height:8px;border-radius:50%;background:#394036;margin-top:4px;box-shadow:0 0 0 4px #161914}.timeline-item:first-child .timeline-mark{background:var(--lime)}.timeline-item strong{display:block;font-size:10px}.timeline-item span{font-size:9px;color:var(--muted);display:block;margin-top:3px}.drawer-actions{position:absolute;bottom:0;left:0;right:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:rgba(13,15,11,.96);backdrop-filter:blur(15px);display:grid;grid-template-columns:1fr 1fr;gap:8px}.drawer-actions .btn{min-height:44px}.comment-box{margin-top:14px;display:grid;gap:8px}.comment-box textarea{width:100%;min-height:84px;background:#11140f;border:1px solid var(--line);border-radius:12px;color:var(--text);padding:11px;font-size:11px;resize:vertical}

/* ---------- tema claro / alternância ---------- */
html[data-theme="light"]{
  color-scheme:light;
  --bg:#f3f5ef;
  --bg-2:#ecefe7;
  --panel:#ffffff;
  --panel-2:#f8faf5;
  --panel-3:#eef2e9;
  --line:#dce2d5;
  --line-strong:#c8d1c0;
  --muted:#687164;
  --muted-2:#858e80;
  --text:#1d211a;
  --warn:#a86a00;
  --info:#2e6f9f;
  --danger:#c84f4f;
  --gray:#6d766a;
  --shadow:0 20px 55px rgba(35,48,27,.12);
  --lime-ink:#587900;
}
.theme-toggle{transition:.18s ease}
.theme-toggle:hover{transform:translateY(-1px)}
.theme-toggle svg{transition:.18s ease}
.theme-choice{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.theme-option{min-height:94px;border:1px solid var(--line);border-radius:13px;background:var(--bg-2);padding:10px;text-align:left;display:grid;gap:8px;color:var(--text);transition:.16s ease}
.theme-option:hover{border-color:var(--line-strong);transform:translateY(-1px)}
.theme-option.active{border-color:rgba(173,244,3,.65);box-shadow:0 0 0 2px rgba(173,244,3,.11)}
.theme-option strong{font-size:10.5px}.theme-option span{font-size:8.8px;color:var(--muted)}
.theme-preview{height:47px;border-radius:9px;border:1px solid var(--line);overflow:hidden;display:grid;grid-template-columns:18px 1fr;gap:5px;padding:5px}
.theme-preview.dark{background:#090a08}.theme-preview.light{background:#f3f5ef}
.theme-preview .p-side{border-radius:5px;background:#151814}.theme-preview.light .p-side{background:#e4e8df}
.theme-preview .p-main{display:grid;grid-template-rows:8px 1fr;gap:4px}.theme-preview .p-bar,.theme-preview .p-card{border-radius:4px;background:#1c2119}.theme-preview.light .p-bar,.theme-preview.light .p-card{background:#fff;border:1px solid #e0e5da}
.theme-preview .p-accent{width:14px;height:4px;border-radius:999px;background:var(--lime);margin:2px}

html[data-theme="light"] body{background:var(--bg);color:var(--text)}
html[data-theme="light"] .sidebar{background:linear-gradient(180deg,#ffffff 0%,#f7f9f4 100%);border-color:var(--line)}

html[data-theme="light"] .nav-badge{background:rgba(173,244,3,.28);color:var(--lime-ink)}
html[data-theme="light"] .profile-mini:hover{background:#eef2e9}
html[data-theme="light"] .topbar{background:rgba(250,252,247,.9);border-color:rgba(220,226,213,.95)}
html[data-theme="light"] .search input,
html[data-theme="light"] .top-icon,
html[data-theme="light"] .role-pill,
html[data-theme="light"] .chip,
html[data-theme="light"] .select-control,
html[data-theme="light"] .month-chip{background:#fff;border-color:var(--line);color:var(--text)}
html[data-theme="light"] .search input::placeholder{color:#9aa293}
html[data-theme="light"] .notification-dot{box-shadow:0 0 0 3px #fff}
html[data-theme="light"] .surface{background:linear-gradient(180deg,#ffffff,#fbfcf9)}
html[data-theme="light"] .section-head h3,
html[data-theme="light"] .detail-block h4,
html[data-theme="light"] .agenda-date{color:#30362d}
html[data-theme="light"] .btn-secondary{background:#fff;color:#252b22;border-color:var(--line)}
html[data-theme="light"] .btn-secondary:hover{background:#eef2e9}
html[data-theme="light"] .link-btn,
html[data-theme="light"] .chip.active,
html[data-theme="light"] .month-chip.active,
html[data-theme="light"] .client-welcome .eyebrow,

function syncThemeUI(){
  const btn=document.getElementById('themeToggle');
  if(btn){btn.innerHTML=currentTheme==='dark'?THEME_ICONS.light:THEME_ICONS.dark;btn.title=currentTheme==='dark'?'Ativar modo claro':'Ativar modo escuro';btn.setAttribute('aria-label',btn.title);btn.setAttribute('aria-pressed',String(currentTheme==='light'));}
  document.querySelectorAll('[data-theme-option]').forEach(b=>b.classList.toggle('active',b.dataset.themeOption===currentTheme));
  document.querySelectorAll('[data-theme-label]').forEach(el=>el.textContent=currentTheme==='dark'?'Modo claro':'Modo escuro');
}
function applyTheme(theme,persist=true){
  currentTheme=theme==='light'?'light':'dark';
  document.documentElement.dataset.theme=currentTheme;
  if(persist){try{localStorage.setItem('apice-theme',currentTheme)}catch(e){}}
  const meta=document.getElementById('themeColorMeta');if(meta)meta.content=currentTheme==='light'?'#f3f5ef':'#090a08';
  if(!DARK_LOGO){const first=document.querySelector('.brand-logo');if(first)DARK_LOGO=first.src;}
  document.querySelectorAll('.brand-logo,.mobile-logo').forEach(img=>{if(DARK_LOGO)img.src=currentTheme==='light'?LIGHT_LOGO:DARK_LOGO;});
  syncThemeUI();
}
function toggleTheme(){applyTheme(currentTheme==='dark'?'light':'dark')}

function clientById(id){return clients.find(c=>c.id===id)}
function visiblePosts(){return role==='client'?posts.filter(p=>p.client===currentClient):posts}
function filteredPosts(){
  const base=visiblePosts();
  if(activeFilter==='all') return base;
  if(activeFilter==='waiting') return base.filter(p=>p.status==='waiting');
  if(activeFilter==='approved') return base.filter(p=>p.status==='approved');
  if(activeFilter==='changes') return base.filter(p=>p.status==='changes');
  if(activeFilter==='draft') return base.filter(p=>p.status==='draft');

}
function statusPillHTML(p,idx,editable=true){
  if(!editable) return `<div class="status-pill st-${p.status}"><span class="dot"></span>${statusLabel[p.status]}</div>`;
  return `<div class="status-wrap"><button class="status-pill st-${p.status}" data-status-toggle="${idx}"><span class="dot"></span>${statusLabel[p.status]}</button><div class="status-menu" id="status-${idx}">${statusOrder.map(s=>`<button data-status-set="${idx}|${s}"><span class="dot st-${s}"></span>${statusLabel[s]}</button>`).join('')}</div></div>`;
}
function mediaIcon(type){return type==='Reels'?ICONS.play:ICONS.image}
function postCard(p){
  const idx=posts.indexOf(p);
  return `<article class="post-card">
    <div class="post-cover ${p.cover}" data-open-post="${p.id}">
      <div class="cover-icon">${mediaIcon(p.type)}</div>
      <span class="media-type">${p.type}</span>
      <button class="card-menu-btn" data-card-menu="${p.id}" aria-label="Mais ações">···</button>
    </div>
    <div class="post-body">
      <div><div class="post-client">${role==='admin'?clientById(p.client).name:p.type}</div><div class="post-title">${p.title}</div></div>
      <div class="post-meta"><span>${p.type}</span><span>${p.date}</span></div>
      ${statusPillHTML(p,idx,role==='admin')}
      <div class="card-actions">
        <button class="card-action" data-history="${p.id}">${ICONS.clock} Histórico</button>
        <button class="card-action primary" data-open-post="${p.id}">${role==='client'?'Revisar':'Abrir'}</button>
      </div>
    </div>
  </article>`;
}

}

function renderNavigation(){
  const nav=role==='admin'?adminNav:clientNav;
  document.getElementById('sideNav').innerHTML=nav.map(([k,l,i])=>`<button class="nav-btn ${route===k?'active':''}" data-route="${k}">${ICONS[i]}<span>${l}</span>${k==='approval'&&visiblePosts().filter(p=>p.status==='waiting').length?`<span class="nav-badge">${visiblePosts().filter(p=>p.status==='waiting').length}</span>`:''}</button>`).join('');
  const mobileMain=[['home','Início','home'],['editorial',role==='admin'?'Editorial':'Planejamento','plan'],['content','Conteúdos','content'],['approval','Aprovações','check']];
  document.getElementById('mobileNav').innerHTML=mobileMain.map(([k,l,i])=>`<button class="${route===k?'active':''}" data-route="${k}">${ICONS[i]}<span>${l}</span></button>`).join('')+`<button id="moreBtn" class="${!mobileMain.some(x=>x[0]===route)?'active':''}">${ICONS.more}<span>Mais</span></button>`;
  const extra=role==='admin'?[['clients','Clientes','users'],['calendar','Calendário','calendar'],['archive','Arquivos','files'],['settings','Configurações','settings']]:[['calendar','Calendário','calendar']];
  document.getElementById('mobileMore').innerHTML=`<small>Navegação</small>${extra.map(([k,l,i])=>`<button class="${route===k?'active':''}" data-route="${k}">${ICONS[i]}${l}</button>`).join('')}<div class="menu-sep"></div><small>Aparência</small><button data-toggle-theme><span data-theme-label>${currentTheme==='dark'?'Modo claro':'Modo escuro'}</span></button><div class="menu-sep"></div><small>Visualização</small><button data-switch-role>${role==='admin'?'Visualizar como cliente':'Voltar ao painel da Ápice'}</button>`;
  document.getElementById('profileRole').textContent=role==='admin'?'Admin · Ápice Studio':'Portal do cliente';
  document.getElementById('rolePillText').textContent=role==='admin'?'Painel administrativo':'Portal do cliente';
}
function render(){
  if(!views[route]) route='home';
  renderNavigation();
  document.getElementById('page').innerHTML=views[route]();
  bindUI();
}
function bindUI(){
  document.querySelectorAll('[data-theme-option]').forEach(b=>b.onclick=()=>applyTheme(b.dataset.themeOption));
  document.querySelectorAll('[data-toggle-theme]').forEach(b=>b.onclick=()=>{toggleTheme();closeMobileMore();render()});
  document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>{route=b.dataset.route;activeFilter='all';closeMobileMore();render();window.scrollTo({top:0,behavior:'smooth'})});
  document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{activeFilter=b.dataset.filter;render()});
  document.querySelectorAll('[data-open-post]').forEach(b=>b.onclick=(e)=>{if(e.target.closest('[data-card-menu]'))return;openPost(Number(b.dataset.openPost))});
  document.querySelectorAll('[data-status-toggle]').forEach(b=>b.onclick=(e)=>{e.stopPropagation();const idx=b.dataset.statusToggle;document.querySelectorAll('.status-menu').forEach(m=>{if(m.id!==`status-${idx}`)m.classList.remove('open')});document.getElementById(`status-${idx}`).classList.toggle('open')});
  document.querySelectorAll('[data-status-set]').forEach(b=>b.onclick=(e)=>{e.stopPropagation();const [idx,s]=b.dataset.statusSet.split('|');posts[Number(idx)].status=s;render()});
  document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>handleAction(b.dataset.action));
  document.querySelectorAll('[data-client]').forEach(b=>b.onclick=()=>{currentClient=b.dataset.client;route='editorial';activeFilter='all';render()});
  const more=document.getElementById('moreBtn');if(more)more.onclick=(e)=>{e.stopPropagation();document.getElementById('mobileMore').classList.toggle('open')};
  document.querySelectorAll('[data-switch-role]').forEach(b=>b.onclick=switchRole);
  document.querySelectorAll('[data-editorial-approve]').forEach(b=>b.onclick=()=>{const ed=currentEditorial();ed.status='approved';ed.approvedAt='Hoje · agora';editorialFeedback='';render()});
  document.querySelectorAll('[data-editorial-change]').forEach(b=>b.onclick=()=>openEditorialFeedback());
  document.querySelectorAll('[data-edit-editorial-item]').forEach(b=>b.onclick=()=>openEditorialItem(b.dataset.editEditorialItem));
  document.querySelectorAll('[data-duplicate-editorial-item]').forEach(b=>b.onclick=()=>{const ed=currentEditorial();const item=ed.items.find(x=>x.id===b.dataset.duplicateEditorialItem);if(item){ed.items.push({...item,id:'e'+Date.now(),day:String(Math.min(31,Number(item.day)+2)).padStart(2,'0'),title:item.title+' — variação'});render()}});
}
function handleAction(action){
  if(action==='new-content'||action==='Planejar conteúdo') openNewContent();
  else if(action==='new-client') openNewClient();
  else if(action==='backup') openBackup();
  else if(action==='view-client') switchRole();
  else if(action==='new-editorial-item') openEditorialItem();
  else if(action==='send-editorial'){const ed=currentEditorial();ed.status='waiting';ed.sentAt='Hoje · agora';render();}
  else if(action==='new-editorial-version'){const ed=currentEditorial();ed.version+=1;ed.status='draft';ed.approvedAt=null;render();}
}
function switchRole(){
  role=role==='admin'?'client':'admin';route='home';activeFilter='all';closeMobileMore();closeProfile();render();window.scrollTo({top:0,behavior:'smooth'});
}
function closeMobileMore(){document.getElementById('mobileMore').classList.remove('open')}
function openPost(id){
  detailPostId=id;const p=posts.find(x=>x.id===id);if(!p)return;const c=clientById(p.client);
  const overlay=document.getElementById('detailOverlay');
  document.getElementById('detailBody').innerHTML=`<div class="detail-preview ${p.type==='Story'?'story':''} ${p.cover}"><div class="cover-icon">${mediaIcon(p.type)}</div></div><div class="detail-title"><div><div class="detail-kicker">${p.type} · ${role==='admin'?c.name:'Versão '+p.version}</div><h2>${p.title}</h2></div></div><div style="margin-top:12px">${statusPillHTML(p,posts.indexOf(p),role==='admin')}</div><p class="detail-copy">${p.caption}</p>${role==='client'&&p.status!=='approved'?`<div class="comment-box"><label style="font-size:10px;font-weight:750;color:#c7ccc1">Comentário para a Ápice</label><textarea id="clientComment" placeholder="Descreva o que gostaria de alterar..."></textarea></div>`:''}<div class="detail-block"><h4>Histórico</h4><div class="timeline"><div class="timeline-item"><span class="timeline-mark"></span><div><strong>Versão ${p.version} enviada para revisão</strong><span>Hoje · 14:32</span></div></div><div class="timeline-item"><span class="timeline-mark"></span><div><strong>Conteúdo atualizado pela Ápice</strong><span>Ontem · 18:10</span></div></div><div class="timeline-item"><span class="timeline-mark"></span><div><strong>Conteúdo criado</strong><span>20/07 · 09:15</span></div></div></div></div>`;
  document.getElementById('detailActions').innerHTML=role==='client'?`<button class="btn btn-secondary" data-request-change>Solicitar alteração</button><button class="btn" data-approve>Aprovar</button>`:`<button class="btn btn-secondary" data-copy-link>${ICONS.link} Copiar link</button><button class="btn" data-new-version>Enviar nova versão</button>`;
  overlay.classList.add('open');overlay.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';
  bindDetail();
}
function bindDetail(){
  document.querySelectorAll('[data-close-detail]').forEach(b=>b.onclick=closeDetail);
  const approve=document.querySelector('[data-approve]');if(approve)approve.onclick=()=>{const p=posts.find(x=>x.id===detailPostId);p.status='approved';openPost(detailPostId);renderNavigation()};
  const change=document.querySelector('[data-request-change]');if(change)change.onclick=()=>{const p=posts.find(x=>x.id===detailPostId);p.status='changes';const ta=document.getElementById('clientComment');if(ta&&!ta.value.trim()){ta.focus();return}openPost(detailPostId);renderNavigation()};
  const ver=document.querySelector('[data-new-version]');if(ver)ver.onclick=()=>{const p=posts.find(x=>x.id===detailPostId);p.version+=1;p.status='waiting';openPost(detailPostId)};
  const copy=document.querySelector('[data-copy-link]');if(copy)copy.onclick=()=>{navigator.clipboard?.writeText(location.href+'#conteudo-'+detailPostId);copy.textContent='Link copiado ✓'};
  document.querySelectorAll('[data-status-toggle]').forEach(b=>b.onclick=(e)=>{e.stopPropagation();const idx=b.dataset.statusToggle;document.getElementById(`status-${idx}`).classList.toggle('open')});
  document.querySelectorAll('[data-status-set]').forEach(b=>b.onclick=(e)=>{e.stopPropagation();const [idx,s]=b.dataset.statusSet.split('|');posts[Number(idx)].status=s;openPost(detailPostId);renderNavigation()});
}
function closeDetail(){const o=document.getElementById('detailOverlay');o.classList.remove('open');o.setAttribute('aria-hidden','true');document.body.style.overflow='';render()}
function openModal(title,body,actions){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modalActions').innerHTML=actions;document.getElementById('modalWrap').classList.add('open');document.body.style.overflow='hidden';document.querySelectorAll('[data-close-modal]').forEach(b=>b.onclick=closeModal)}
function closeModal(){document.getElementById('modalWrap').classList.remove('open');document.body.style.overflow=''}
function openNewContent(){
  openModal('Novo conteúdo',`<div class="form-grid"><div class="field"><label>Cliente</label><select id="newClient">${clients.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select></div><div class="field"><label>Formato</label><select id="newType"><option>Post</option><option>Carrossel</option><option>Reels</option><option>Story</option></select></div><div class="field full"><label>Título</label><input id="newTitle" placeholder="Ex.: Campanha de inverno"></div><div class="field"><label>Data</label><input type="date" value="2026-07-28"></div><div class="field"><label>Horário</label><input type="time" value="18:00"></div><div class="field full"><label>Legenda / observações</label><textarea id="newCaption" placeholder="Texto que acompanhará o conteúdo..."></textarea></div><div class="full upload-zone"><div><strong>Arraste a mídia ou clique para selecionar</strong><span>MP4, JPG, PNG ou WEBP · versão otimizada para aprovação</span></div></div></div>`,`<button class="btn btn-secondary" data-close-modal>Cancelar</button><button class="btn" id="createContent">Criar conteúdo</button>`);
  document.getElementById('createContent').onclick=()=>{const title=document.getElementById('newTitle').value.trim()||'Novo conteúdo';posts.unshift({id:Date.now(),client:document.getElementById('newClient').value,title,type:document.getElementById('newType').value,date:'28/07 · 18:00',status:'draft',cover:'cv1',caption:document.getElementById('newCaption').value||'Conteúdo em preparação.',version:1});closeModal();route='content';render()};
  document.querySelectorAll('[data-close-modal]').forEach(b=>b.onclick=closeModal);
}
function openNewClient(){openModal('Novo cliente',`<div class="form-grid"><div class="field full"><label>Nome da marca / cliente</label><input placeholder="Ex.: Clínica Nova Vida"></div><div class="field"><label>Responsável</label><input placeholder="Nome do contato"></div><div class="field"><label>E-mail de acesso</label><input type="email" placeholder="cliente@email.com"></div><div class="field full"><label>Observações</label><textarea placeholder="Informações internas da conta..."></textarea></div></div>`,`<button class="btn btn-secondary" data-close-modal>Cancelar</button><button class="btn" data-close-modal>Criar cliente</button>`);document.querySelectorAll('[data-close-modal]').forEach(b=>b.onclick=closeModal)}

function openEditorialItem(id=null){
  const ed=currentEditorial();const item=id?ed.items.find(x=>x.id===id):null;
  openModal(item?'Editar publicação do editorial':'Nova publicação no editorial',`<div class="form-grid"><div class="field"><label>Dia</label><input id="edDay" type="number" min="1" max="31" value="${item?.day||'30'}"></div><div class="field"><label>Formato</label><select id="edType">${['Post','Carrossel','Reels','Story'].map(t=>`<option ${item?.type===t?'selected':''}>${t}</option>`).join('')}</select></div><div class="field full"><label>Tema / título</label><input id="edTitle" value="${item?.title||''}" placeholder="Ex.: 5 sinais que você não deve ignorar"></div><div class="field full"><label>Ideia e direcionamento</label><textarea id="edIdea" placeholder="Explique o que será abordado e como a publicação deve funcionar.">${item?.idea||''}</textarea></div><div class="field"><label>Objetivo</label><input id="edObjective" value="${item?.objective||''}" placeholder="Ex.: autoridade + salvamentos"></div><div class="field"><label>Link de referência</label><input id="edReference" value="${item?.reference||''}" placeholder="https://..."></div><div class="field full"><label>Como será produzido</label><textarea id="edNotes" placeholder="Visual, quantidade de páginas, dinâmica, gravação, CTA...">${item?.notes||''}</textarea></div></div>`,`<button class="btn btn-secondary" data-close-modal>Cancelar</button><button class="btn" id="saveEditorialItem">${item?'Salvar alterações':'Adicionar ao editorial'}</button>`);
  document.getElementById('saveEditorialItem').onclick=()=>{const data={day:String(document.getElementById('edDay').value||30).padStart(2,'0'),weekday:'',type:document.getElementById('edType').value,title:document.getElementById('edTitle').value.trim()||'Nova publicação',idea:document.getElementById('edIdea').value.trim()||'Direcionamento a definir.',objective:document.getElementById('edObjective').value.trim()||'Objetivo a definir',reference:document.getElementById('edReference').value.trim(),referenceLabel:'Abrir referência',notes:document.getElementById('edNotes').value.trim()||'Detalhes de produção a definir.'};if(item)Object.assign(item,data);else ed.items.push({id:'e'+Date.now(),...data});ed.status='draft';ed.approvedAt=null;closeModal();render()};
  document.querySelectorAll('[data-close-modal]').forEach(b=>b.onclick=closeModal);
}
function openEditorialFeedback(){
  openModal('Solicitar ajustes no editorial',`<div class="field"><label>O que você gostaria de ajustar?</label><textarea id="editorialFeedback" style="min-height:150px" placeholder="Você pode comentar o planejamento como um todo. Comentários específicos também podem ser escritos em cada publicação.">${editorialFeedback}</textarea></div><p class="hint" style="margin-top:10px">A Ápice receberá este retorno antes de iniciar a produção. A versão atual continuará registrada no histórico.</p>`,`<button class="btn btn-secondary" data-close-modal>Cancelar</button><button class="btn" id="sendEditorialFeedback">Enviar ajustes</button>`);
  document.getElementById('sendEditorialFeedback').onclick=()=>{editorialFeedback=document.getElementById('editorialFeedback').value.trim();if(!editorialFeedback){document.getElementById('editorialFeedback').focus();return}const ed=currentEditorial();ed.status='changes';closeModal();render()};document.querySelectorAll('[data-close-modal]').forEach(b=>b.onclick=closeModal);
}

function openBackup(){openModal('Fechar julho de 2026',`<div style="display:grid;gap:14px"><section class="surface" style="padding:15px"><strong style="font-size:11px">O backup incluirá</strong><p class="storage-copy" style="margin-top:8px">Mídias do mês, legendas, calendário editorial, histórico de aprovação e relatório organizado para arquivamento.</p></section><section class="surface" style="padding:15px"><strong style="font-size:11px">Depois do download</strong><p class="storage-copy" style="margin-top:8px">Você poderá liberar apenas as mídias antigas. Os registros do mês continuarão acessíveis no histórico da Ápice.</p></section></div>`,`<button class="btn btn-secondary" data-close-modal>Cancelar</button><button class="btn" id="generateBackup">Gerar backup</button>`);document.getElementById('generateBackup').onclick=()=>{document.getElementById('generateBackup').textContent='Backup pronto ✓'};document.querySelectorAll('[data-close-modal]').forEach(b=>b.onclick=closeModal)}
function openProfile(anchor){
  const pop=document.getElementById('profilePopover');const r=anchor.getBoundingClientRect();pop.style.top=Math.min(window.innerHeight-180,r.bottom+8)+'px';pop.style.left=Math.max(10,Math.min(window.innerWidth-230,r.right-220))+'px';pop.innerHTML=`<button data-switch-role>${role==='admin'?'Visualizar como cliente':'Voltar ao painel da Ápice'}</button><div class="popover-sep"></div><button data-profile-theme>${currentTheme==='dark'?'☀ Modo claro':'☾ Modo escuro'}</button><button>Minha conta</button><button>Preferências</button>`;pop.classList.add('open');pop.querySelector('[data-switch-role]').onclick=switchRole;pop.querySelector('[data-profile-theme]').onclick=()=>{toggleTheme();closeProfile();render()};
}
function closeProfile(){document.getElementById('profilePopover').classList.remove('open')}

document.getElementById('detailOverlay').addEventListener('click',e=>{if(e.target===e.currentTarget)closeDetail()});
document.getElementById('modalWrap').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal()});
document.addEventListener('click',e=>{if(!e.target.closest('.status-wrap'))document.querySelectorAll('.status-menu').forEach(m=>m.classList.remove('open'));if(!e.target.closest('#mobileMore')&&!e.target.closest('#moreBtn'))closeMobileMore();if(!e.target.closest('#profilePopover')&&!e.target.closest('#profileMini')&&!e.target.closest('#mobileProfile')&&!e.target.closest('#rolePill'))closeProfile()});
document.getElementById('profileMini').onclick=(e)=>{e.stopPropagation();openProfile(e.currentTarget)};
document.getElementById('mobileProfile').onclick=(e)=>{e.stopPropagation();openProfile(e.currentTarget)};
document.getElementById('rolePill').onclick=(e)=>{e.stopPropagation();openProfile(e.currentTarget)};
document.getElementById('themeToggle').onclick=(e)=>{e.stopPropagation();toggleTheme();render()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDetail();closeModal();closeMobileMore();closeProfile()}});
applyTheme(currentTheme,false);
render();
</script>
</body>
</html>
